name: mask/properties
typeName: mask_properties
prefixFields: false
basics:
  - TYPO3/Appearance
  - TYPO3/Links
fields:
  -
    type: Text
    identifier: tx_mask_property_sub
    label: Subtitle
  -
    type: Text
    identifier: tx_mask_property_title
    label: Title
  -
    type: Collection
    identifier: tx_mask_property_info
    label: 'Properties Info'
    appearance:
      enabledControls:
        delete: true
        dragdrop: true
        hide: true
        info: true
        localize: true
        new: true
        sort: true
      levelLinksPosition: top
      showAllLocalizationLink: true
      showNewRecordLink: true
      showPossibleLocalizationRecords: true
      useSortable: true
    foreign_field: parentid
    foreign_sortby: sorting
    fields:
      -
        type: File
        identifier: tx_mask_images
        label: Images
        appearance:
          elementBrowserEnabled: true
          enabledControls:
            delete: true
            dragdrop: true
            hide: true
            info: true
            localize: true
            sort: false
          fileUploadAllowed: true
          useSortable: true
        allowed: common-image-types
      -
        type: Text
        identifier: tx_mask_villa_name
        label: 'Villa Name'
      -
        type: Text
        identifier: tx_mask_price
        label: Price
      -
        type: Text
        identifier: tx_mask_address
        label: Address
      -
        type: Collection
        identifier: tx_mask_items
        label: 'Property Items'
        appearance:
          enabledControls:
            delete: true
            dragdrop: true
            hide: true
            info: true
            localize: true
            new: true
            sort: true
          levelLinksPosition: top
          showAllLocalizationLink: true
          showNewRecordLink: true
          showPossibleLocalizationRecords: true
          useSortable: true
        foreign_field: parentid
        foreign_sortby: sorting
        fields:
          -
            type: Text
            identifier: tx_mask_items_label
            label: Label
          -
            type: Text
            identifier: tx_mask_item_value
            label: Value
  -
    type: Text
    identifier: tx_mask_button_text_
    label: 'Button Name'
  -
    type: Link
    identifier: tx_mask_button_link
    label: 'Button LInk'
